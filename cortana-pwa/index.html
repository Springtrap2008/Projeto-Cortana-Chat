<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <title>Cortana</title>
    <link rel="manifest" href="manifest.json" />
    <link rel="apple-touch-icon" href="icons/icon-192.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Cortana" />
    <meta name="theme-color" content="#00d4ff" />
    <style>
        * { box-sizing: border-box; }
        html, body {
            margin: 0; padding: 0; height: 100%; width: 100%;
            overflow: hidden; background-color: #212121;
            font-family: -apple-system, 'Segoe UI', system-ui, sans-serif;
        }
        
        /* O CHAT ocupa a tela inteira e corta o rodapé branco */
        #frame-container {
            position: fixed; top: -5px; left: -5px; right: -5px; bottom: -80px;
            overflow: hidden; z-index: 1;
        }
        iframe { width: 100%; height: 100%; border: none; display: block; }
        
        /* BOTÃO FLUTUANTE (Começa escondido) */
        #btn-notif {
            position: fixed; bottom: calc(30px + env(safe-area-inset-bottom)); right: 20px;
            background: #00d4ff; color: #171717; border: none; border-radius: 25px;
            padding: 12px 20px; font-size: 14px; font-weight: 700; cursor: pointer;
            z-index: 9999999; box-shadow: 0 4px 12px rgba(0, 212, 255, 0.4);
            display: none; /* Começa escondido */
            align-items: center; gap: 8px;
        }
        
        /* PAINEL DE CÓPIA DO JSON */
        #copy-panel {
            position: fixed; top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(23, 23, 23, 0.95); color: #ececec; padding: 20px;
            z-index: 99999999; overflow: auto; display: none;
            backdrop-filter: blur(4px);
        }
        #copy-panel h2 { color: #00d4ff; font-size: 18px; margin-top: 10px; }
        #copy-panel p { font-size: 14px; color: #b4b4b4; line-height: 1.5; }
        #copy-panel textarea {
            width: 100%; height: 250px; background: #2f2f2f; color: #ececec;
            border: 1px solid #3f3f3f; border-radius: 8px; padding: 10px;
            font-family: 'Consolas', monospace; font-size: 11px; resize: vertical;
        }
        #copy-panel button {
            background: #00d4ff; color: #171717; border: none; border-radius: 8px;
            padding: 12px 16px; font-weight: 600; margin-top: 10px; cursor: pointer; width: 100%;
        }
        #btn-close { background: #2f2f2f !important; color: #ececec !important; }
    </style>
</head>
<body>

<div id="frame-container">
    <iframe id="cortana-frame" src="https://projeto-cortana-chat-2wqvs4zfnubjktjzzui4sb.streamlit.app/?embed=true&embed_options=hide_toolbar" title="Cortana"></iframe>
</div>

<button id="btn-notif">🔔 Ativar Notificações</button>

<div id="copy-panel">
    <h2>Inscrição Push</h2>
    <p>Copie o texto abaixo, salve no arquivo <code>subscription.json</code> na pasta do seu app Streamlit.</p>
    <textarea id="sub-json" readonly></textarea>
    <button id="btn-copy">Copiar JSON</button>
    <button id="btn-close">Fechar</button>
</div>

<script>
const VAPID_PUBLIC_KEY = "BNOGN3Y0jMz33U4b-gl8R-adOc_zz3IRI5haihvx7F9WkELmQTfCVHuamEtqNwYFlcJ5QRRsxFosWSb7Biltyig";

function urlBase64ToUint8Array(base64String) {
    const padding = "=".repeat((4 - base64String.length % 4) % 4);
    const base64 = (base64String + padding).replace(/-/g, "+").replace(/_/g, "/");
    const rawData = atob(base64);
    return Uint8Array.from([...rawData].map(c => c.charCodeAt(0)));
}

if ("serviceWorker" in navigator) {
    navigator.serviceWorker.register("service-worker.js", { scope: "./" }).catch(err => console.error(err));
}

const btn = document.getElementById("btn-notif");

async function ativarNotificacoes() {
    try {
        const permission = await Notification.requestPermission();
        if (permission !== "granted") return;

        const reg = await navigator.serviceWorker.ready;
        let sub = await reg.pushManager.getSubscription();
        if (!sub) {
            sub = await reg.pushManager.subscribe({
                userVisibleOnly: true,
                applicationServerKey: urlBase64ToUint8Array(VAPID_PUBLIC_KEY)
            });
        }
        document.getElementById("sub-json").value = JSON.stringify(sub, null, 2);
        document.getElementById("copy-panel").style.display = "block";
        localStorage.setItem("cortana_subscription", JSON.stringify(sub));
        btn.style.display = "none"; // Esconde após o sucesso
    } catch (error) {
        alert("Erro: " + error.message);
    }
}

btn.addEventListener("click", ativarNotificacoes);

// Lógica para mostrar o botão apenas se não tiver inscrição ou se for forçado via URL
navigator.serviceWorker.ready.then(async reg => {
    const sub = await reg.pushManager.getSubscription();
    if (!sub || window.location.search.includes("reset=true")) {
        btn.style.display = "flex"; // Mostra o botão
    }
});

document.getElementById("btn-copy").addEventListener("click", async () => {
    const text = document.getElementById("sub-json").value;
    try {
        await navigator.clipboard.writeText(text);
        alert("JSON copiado com sucesso!");
    } catch (e) {
        document.getElementById("sub-json").select();
        document.execCommand("copy");
        alert("JSON copiado com sucesso!");
    }
});

document.getElementById("btn-close").addEventListener("click", () => {
    document.getElementById("copy-panel").style.display = "none";
});
</script>
</body>
</html>
