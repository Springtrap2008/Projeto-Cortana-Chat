<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <title>Cortana</title>
    <link rel="manifest" href="manifest.json" />
    <link rel="apple-touch-icon" href="icons/icon-192.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Cortana" />
    <meta name="theme-color" content="#00d4ff" />
    <style>
        * { box-sizing: border-box; }
        html, body { margin: 0; padding: 0; height: 100%; width: 100%; overflow: hidden; background-color: #212121; font-family: -apple-system, sans-serif; }
        
        #debug-panel {
            position: fixed; top: 0; left: 0; right: 0;
            background: rgba(255, 0, 0, 0.9); color: white;
            z-index: 999999999; font-size: 12px; padding: 10px;
            text-align: center; font-weight: bold;
        }

        #frame-container { position: fixed; top: 40px; left: -5px; right: -5px; bottom: -80px; overflow: hidden; z-index: 1; }
        iframe { width: 100%; height: 100%; border: none; display: block; }
        
        #btn-notif {
            position: fixed; bottom: calc(30px + env(safe-area-inset-bottom)); right: 20px;
            background: #00d4ff; color: #171717; border: none; border-radius: 25px;
            padding: 12px 20px; font-size: 14px; font-weight: 700; cursor: pointer;
            z-index: 9999999; box-shadow: 0 4px 12px rgba(0, 212, 255, 0.4);
            display: flex; align-items: center; gap: 8px;
        }
        
        #copy-panel { position: fixed; top: 0; left: 0; right: 0; bottom: 0; background: #171717; padding: 20px; z-index: 99999999; display: none; }
        #copy-panel textarea { width: 100%; height: 200px; background: #2f2f2f; color: white; border: 1px solid #444; padding: 10px; }
        #copy-panel button { padding: 10px; margin-top: 10px; width: 100%; background: #00d4ff; border: none; font-weight: bold; }
    </style>
</head>
<body>

<!-- PAINEL DE DEBUG (Vermelho no topo) -->
<div id="debug-panel">Status: Procurando Service Worker...</div>

<div id="frame-container">
    <!-- URL do Streamlit -->
    <iframe id="cortana-frame" src="https://projeto-cortana-chat-2wqvs4zfnubjktjzzui4sb.streamlit.app/?embed=true&embed_options=hide_toolbar" title="Cortana"></iframe>
</div>

<button id="btn-notif">🔔 Ativar Notificações</button>

<div id="copy-panel">
    <h3 style="color:white">Copie o JSON:</h3>
    <textarea id="sub-json" readonly></textarea>
    <button onclick="document.getElementById('copy-panel').style.display='none'">Fechar</button>
</div>

<script>
const debug = document.getElementById("debug-panel");
const btn = document.getElementById("btn-notif");
const VAPID_PUBLIC_KEY = "BGRvvM338m4KnKvads_rS3Nz5uoffP0VwHnKAgWMrZIb4Lg89kPFg_MtGBJCrTdkt1W4YuVou9wZYEogRbV2w-M";

function urlBase64ToUint8Array(base64String) {
    const padding = "=".repeat((4 - base64String.length % 4) % 4);
    const base64 = (base64String + padding).replace(/-/g, "+").replace(/_/g, "/");
    const rawData = atob(base64);
    return Uint8Array.from([...rawData].map(c => c.charCodeAt(0)));
}

// Registra o SW
if ("serviceWorker" in navigator) {
    navigator.serviceWorker.register("service-worker.js")
        .then(reg => { debug.innerText = "Status: SW Registrado. Pronto para clicar."; })
        .catch(err => { debug.innerText = "Erro SW: " + err; });
} else {
    debug.innerText = "ERRO: Navegador não suporta SW.";
}

// Clique do Botão
btn.addEventListener("click", async () => {
    debug.innerText = "Status: Solicitando permissão...";
    try {
        const permission = await Notification.requestPermission();
        debug.innerText = "Permissão: " + permission;
        
        if (permission !== "granted") {
            return; // Para se negar
        }

        const reg = await navigator.serviceWorker.ready;
        let sub = await reg.pushManager.getSubscription();

        if (!sub) {
            debug.innerText = "Status: Gerando Push (Aguarde)...";
            sub = await reg.pushManager.subscribe({
                userVisibleOnly: true,
                applicationServerKey: urlBase64ToUint8Array(VAPID_PUBLIC_KEY)
            });
        }

        debug.innerText = "Status: SUCESSO! Copie o JSON.";
        document.getElementById("sub-json").value = JSON.stringify(sub, null, 2);
        document.getElementById("copy-panel").style.display = "block";
        
    } catch (error) {
        debug.innerText = "ERRO GRAVE: " + error.message;
    }
});
</script>
</body>
</html>
